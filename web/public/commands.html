<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            var theme = localStorage.getItem('veyra_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands | VEYRA Discord Bot</title>
    <link rel="icon" type="image/webp" href="assets/bypass_logs_avatar.webp">
    <!-- Google Fonts: Outfit and Inter for exact AmariBot typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root, [data-theme="light"] {
            --bg-dark: #FFFCFA;
            --bg-section: #FFF6F4;
            --bg-card: #FFFFFF;
            --bg-card-hover: #FFF9F8;
            --coral-primary: #D96C91;
            --coral-hover: #B94E76;
            --coral-subtle: #FBE8EE;
            --text-main: #352B3A;
            --text-muted: #766C78;
            --text-sub: #958B96;
            --border-subtle: #EDE4E7;
            --border-focus: rgba(217, 108, 145, 0.4);
            --card-shadow: 0 4px 18px rgba(53, 43, 58, 0.04);
            --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-dark: #121418;
            --bg-section: #16181D;
            --bg-card: #1C1E24;
            --bg-card-hover: #23262E;
            --coral-primary: #D96C91;
            --coral-hover: #B94E76;
            --coral-subtle: rgba(217, 108, 145, 0.16);
            --text-main: #FBF8F5;
            --text-muted: #9DA4B0;
            --text-sub: #6B7280;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(217, 108, 145, 0.4);
            --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Perspective Grid Background Floor */
        .perspective-grid-floor {
            display: none !important;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            background: linear-gradient(to bottom, transparent, rgba(18, 20, 24, 0.95)),
                        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 60px),
                        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 60px);
            transform: perspective(400px) rotateX(60deg) scale(2);
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* Ambient spotlight glow */
        .ambient-spotlight {
            position: fixed;
            top: 15%;
            right: 5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(226, 103, 73, 0.14) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* Top Navigation Header */
        .amari-nav {
            position: relative;
            z-index: 50;
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .amari-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }
        .amari-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }
        .amari-brand-name {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }
        .amari-brand-sub {
            font-size: 0.72rem;
            color: var(--coral-primary);
            font-weight: 700;
            margin-left: 2px;
        }

        .amari-nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }
        .amari-nav-links a, .amari-nav-links button {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .amari-nav-links a:hover, .amari-nav-links button:hover {
            color: var(--coral-primary);
        }
        .amari-nav-links a.active {
            color: var(--coral-primary);
            font-weight: 600;
        }

        /* Dropdown */
        .nav-item-dropdown {
            position: relative;
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #181A20;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px;
            min-width: 140px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
        }
        .nav-item-dropdown:hover .dropdown-menu {
            display: flex;
        }
        .dropdown-menu a {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .dropdown-menu a:hover {
            background: var(--coral-subtle);
            color: var(--coral-hover);
        }

        .amari-login-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 24px;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .amari-login-btn:hover {
            background: var(--coral-subtle);
            border-color: var(--coral-primary);
        }

        /* Main Content Container */
        .commands-main {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 40px auto 100px auto;
            padding: 0 24px;
        }

        .commands-header {
            margin-bottom: 36px;
        }
        .commands-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--coral-primary);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .commands-sub {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Two-Column Grid */
        .commands-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
            align-items: flex-start;
        }

        /* Left Filter Column */
        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .search-input:focus {
            border-color: var(--border-focus);
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .cat-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-btn:hover {
            background: var(--coral-subtle);
            color: var(--coral-hover);
        }
        .cat-btn.active {
            background: #16181D;
            color: var(--coral-primary);
            font-weight: 700;
        }
        .cat-count {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-family: var(--font-mono);
        }

        /* Right Accordion List */
        .commands-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cmd-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .cmd-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .cmd-card.open {
            border-color: rgba(226, 103, 73, 0.3);
        }

        .cmd-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .cmd-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .cmd-name {
            font-family: var(--font-display);
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .cmd-summary {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .cmd-meta {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .cmd-badge {
            background: var(--coral-subtle);
            color: var(--coral-hover);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .cmd-badge.owner {
            background: rgba(226, 103, 73, 0.15);
            color: var(--coral-primary);
        }
        .cmd-badge.admin {
            background: rgba(168, 85, 247, 0.15);
            color: #C084FC;
        }

        .cmd-arrow {
            color: var(--text-sub);
            font-size: 0.85rem;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cmd-card.open .cmd-arrow {
            transform: rotate(180deg);
            color: var(--coral-primary);
        }

        /* Expanded Details */
        .cmd-body {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
            padding-top: 16px;
        }
        .cmd-card.open .cmd-body {
            display: block;
        }
        .cmd-desc-full {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .cmd-syntax-box {
            background: #14161B;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--coral-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cmd-syntax-copy {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.8rem;
            transition: color 0.15s;
        }
        .cmd-syntax-copy:hover {
            color: var(--coral-primary);
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        @media (max-width: 900px) {
            .commands-layout {
                grid-template-columns: 1fr;
            }
            .amari-nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Perspective floor grid -->
    <div class="perspective-grid-floor"></div>
    <div class="ambient-spotlight"></div>

    <!-- Navigation Header -->
    <header>
        <nav class="amari-nav">
            <a href="/" class="amari-brand">
                <img src="assets/bypass_logs_avatar.webp" class="amari-brand-icon" alt="VEYRA" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <div>
                    <span class="amari-brand-name">veyra</span>
                    <span class="amari-brand-sub">bot</span>
                </div>
            </a>

            <ul class="amari-nav-links">
                <li><a href="/commands.html" class="active">Commands</a></li>
                <li class="nav-item-dropdown">
                    <button>About <i class="fas fa-chevron-down" style="font-size: 0.7rem; margin-left: 2px;"></i></button>
                    <div class="dropdown-menu">
                        <a href="/about.html">Docs</a>
                        <a href="/about.html#faq">FAQ</a>
                        <a href="/about.html#api">API</a>
                    </div>
                </li>
                <li><a href="/#pricing">Premium</a></li>
                <li><a href="https://discord.gg/77P5Cq837X" target="_blank" rel="noreferrer">Support</a></li>
            </ul>

            <div>
                <a href="/#screen-dashboard" class="amari-login-btn">Dashboard</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="commands-main">
        <div class="commands-header">
            <h1 class="commands-title">Commands</h1>
            <p class="commands-sub">Find all the information about the list of commands available to you with VeyraBot.</p>
        </div>

        <div class="commands-layout">
            <!-- Left Sidebar -->
            <aside class="filter-panel">
                <div class="search-box">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="cmd-search" class="search-input" placeholder="Search..." oninput="handleSearch()">
                </div>

                <div class="category-list">
                    <button class="cat-btn active" data-cat="all" onclick="filterCategory('all', this)">
                        <span>All</span>
                        <span class="cat-count" id="count-all">201</span>
                    </button>
                    <button class="cat-btn" data-cat="Admin" onclick="filterCategory('Admin', this)">
                        <span>Admin</span>
                        <span class="cat-count" id="count-admin">86</span>
                    </button>
                    <button class="cat-btn" data-cat="General" onclick="filterCategory('General', this)">
                        <span>General</span>
                        <span class="cat-count" id="count-general">89</span>
                    </button>
                    <button class="cat-btn" data-cat="Premium" onclick="filterCategory('Premium', this)">
                        <span>Premium</span>
                        <span class="cat-count" id="count-premium">26</span>
                    </button>
                </div>
            </aside>

            <!-- Right Accordion List -->
            <section class="commands-list" id="commands-container">
                <!-- Injected via JavaScript -->
            </section>
        </div>
    </main>

    <script>
        let allCommands = [];
        let currentCategory = 'all';
        let searchQuery = '';

        async function loadCommands() {
            try {
                const res = await fetch('/real_commands.json?v=v3_high_contrast_352B3A');
                if (res.ok) {
                    allCommands = await res.json();
                } else {
                    console.warn('Fallback inline commands.');
                }
            } catch (e) {
                console.error(e);
            }
            updateCounts();
            renderCommands();
        }

        function updateCounts() {
            document.getElementById('count-all').textContent = allCommands.length;
            document.getElementById('count-admin').textContent = allCommands.filter(c => c.category === 'Admin').length;
            document.getElementById('count-general').textContent = allCommands.filter(c => c.category === 'General').length;
            document.getElementById('count-premium').textContent = allCommands.filter(c => c.category === 'Premium').length;
        }

        function filterCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
            renderCommands();
        }

        function handleSearch() {
            searchQuery = document.getElementById('cmd-search').value.toLowerCase().trim();
            renderCommands();
        }

        function toggleCard(cardEl) {
            cardEl.classList.toggle('open');
        }

        function copyCmd(cmdText, event) {
            if (event) event.stopPropagation();
            navigator.clipboard.writeText(cmdText);
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-check" style="color: #10B981;"></i>';
            setTimeout(() => {
                btn.innerHTML = '<i class="far fa-copy"></i>';
            }, 1500);
        }

        function renderCommands() {
            const container = document.getElementById('commands-container');
            const filtered = allCommands.filter(c => {
                const matchCat = (currentCategory === 'all' || c.category === currentCategory);
                const matchSearch = !searchQuery || 
                    c.name.toLowerCase().includes(searchQuery) || 
                    c.raw.toLowerCase().includes(searchQuery) || 
                    c.desc.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No matching commands found.</div>';
                return;
            }

            container.innerHTML = filtered.map(c => {
                const badgeHtml = c.badge ? `<span class="cmd-badge ${c.badge.toLowerCase()}">${c.badge}</span>` : '';
                return `
                    <div class="cmd-card" onclick="toggleCard(this)">
                        <div class="cmd-header">
                            <div class="cmd-info">
                                <div class="cmd-name">${c.name}</div>
                                <div class="cmd-summary">${c.desc}</div>
                            </div>
                            <div class="cmd-meta">
                                ${badgeHtml}
                                <i class="fas fa-chevron-down cmd-arrow"></i>
                            </div>
                        </div>
                        <div class="cmd-body" onclick="event.stopPropagation()">
                            <p class="cmd-desc-full">${c.desc}</p>
                            <div class="cmd-syntax-box">
                                <code>${c.raw}</code>
                                <button class="cmd-syntax-copy" title="Copy command" onclick="copyCmd('${c.raw}', event)">
                                    <i class="far fa-copy"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', loadCommands);

        function initCmdTheme() {
            const saved = localStorage.getItem('veyra_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('theme-toggle-icon-cmd');
            if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleCmdTheme() {
            const curr = document.documentElement.getAttribute('data-theme') || 'light';
            const next = curr === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('veyra_theme', next);
            const icon = document.getElementById('theme-toggle-icon-cmd');
            if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        window.addEventListener('DOMContentLoaded', initCmdTheme);

    </script>
</body>
</html>
