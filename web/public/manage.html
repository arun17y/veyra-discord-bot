<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            var theme = localStorage.getItem('veyra_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Management | VEYRA Discord Bot</title>
    <link rel="icon" type="image/webp" href="assets/bypass_logs_avatar.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/themes.css?v=v13_dashboard_realtime_manage_fix">
    <link rel="stylesheet" href="css/dashboard.css?v=v13_dashboard_realtime_manage_fix">
    
    <style>
        :root, [data-theme="light"] {
            --bg-dark: #FFFCFA;
            --bg-card: #FFFFFF;
            --coral-primary: #D96C91;
            --coral-hover: #B94E76;
            --text-main: #352B3A;
            --text-muted: #766C78;
            --border-subtle: #EDE4E7;
            --card-shadow: 0 4px 20px rgba(53, 43, 58, 0.05);
            --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-dark: #121418;
            --bg-card: #1C1E24;
            --coral-primary: #D96C91;
            --coral-hover: #B94E76;
            --text-main: #FBF8F5;
            --text-muted: #9DA4B0;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-dark) !important;
            color: var(--text-main) !important;
            font-family: var(--font-body) !important;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .perspective-grid-floor {
            display: none !important;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            background: linear-gradient(to bottom, transparent, rgba(18, 20, 24, 0.95)),
                        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 60px),
                        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 60px);
            transform: perspective(400px) rotateX(60deg) scale(2);
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .ambient-spotlight {
            position: fixed;
            top: 20%;
            right: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(226, 103, 73, 0.12) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* Nav */
        .amari-nav {
            position: relative;
            z-index: 50;
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .amari-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }
        .amari-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }
        .amari-brand-name {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }
        .amari-brand-sub {
            font-size: 0.72rem;
            color: var(--coral-primary);
            font-weight: 700;
            margin-left: 2px;
        }
        .amari-nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }
        .amari-nav-links a, .amari-nav-links button {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .amari-nav-links a:hover, .amari-nav-links button:hover { color: var(--coral-primary); }
        .amari-nav-links a.active { color: var(--coral-primary); font-weight: 600; }
        .nav-item-dropdown { position: relative; }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #181A20;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px;
            min-width: 140px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
        }
        .nav-item-dropdown:hover .dropdown-menu { display: flex; }
        .dropdown-menu a {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            color: #9DA4B0;
        }
        .dropdown-menu a:hover {
            background: var(--coral-primary);
            color: #FFFFFF;
        }
        .amari-login-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 24px;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .amari-login-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Server Management Container Overrides */
        #screen-servers {
            position: relative;
            z-index: 10;
        }
        #screen-servers h1 {
            font-family: var(--font-display) !important;
            font-weight: 800 !important;
            letter-spacing: -0.02em !important;
        }
        .server-card-amari {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-subtle) !important;
            border-radius: 14px !important;
            padding: 22px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important;
            transition: all 0.2s ease !important;
        }
        .server-card-amari:hover {
            border-color: rgba(226, 103, 73, 0.35) !important;
            transform: translateY(-2px);
        }
        .server-manage-btn-amari {
            background: var(--coral-primary) !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 8px !important;
            font-family: var(--font-display) !important;
            font-size: 0.95rem !important;
            font-weight: 700 !important;
            padding: 12px 0 !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            width: 100%;
        }
        .server-manage-btn-amari:hover {
            background: var(--coral-hover) !important;
        }
    </style>
</head>
<body>

    <div class="perspective-grid-floor"></div>
    <div class="ambient-spotlight"></div>

    <!-- Navigation Header -->
    <header>
        <nav class="amari-nav">
            <a href="/" class="amari-brand">
                <img src="assets/bypass_logs_avatar.webp" class="amari-brand-icon" alt="VEYRA" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <div>
                    <span class="amari-brand-name">veyra</span>
                    <span class="amari-brand-sub">bot</span>
                </div>
            </a>

            <ul class="amari-nav-links">
                <li><a href="/commands.html">Commands</a></li>
                <li class="nav-item-dropdown">
                    <button>About <i class="fas fa-chevron-down" style="font-size: 0.7rem; margin-left: 2px;"></i></button>
                    <div class="dropdown-menu">
                        <a href="/about.html">Docs</a>
                        <a href="/about.html#faq">FAQ</a>
                        <a href="/about.html#api">API</a>
                    </div>
                </li>
                <li><a href="/premium.html">Premium</a></li>
                <li><a href="https://discord.gg/77P5Cq837X" target="_blank" rel="noreferrer">Support</a></li>
            </ul>

            <div style="display: flex; align-items: center; gap: 14px;">
                <button id="theme-toggle-btn-mng" onclick="toggleMngTheme()" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-main); cursor: pointer; transition: all 0.2s;" title="Toggle Light/Dark Theme">
                    <i class="fas fa-moon" id="theme-toggle-icon-mng"></i>
                </button>
                <a href="/manage" class="amari-login-btn active" style="border-color: var(--coral-primary); color: var(--coral-primary); background: var(--bg-card);">Dashboard</a>
            </div>
        </nav>
    </header>

    <div style="padding-top: 40px; min-height: 70vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;">
        <section id="screen-servers" class="content-area" style="display:block; max-width:550px; margin: 0 auto 60px auto; padding: 20px; width: 100%;">
            <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--coral-primary); margin-bottom: 12px;"></i>
                <p>Loading servers directory...</p>
            </div>
        </section>
    </div>

    <script src="js/dashboard.js?v=v13_dashboard_realtime_manage_fix"></script>

    <script>
        function initMngTheme() {
            const saved = localStorage.getItem('veyra_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('theme-toggle-icon-mng');
            if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleMngTheme() {
            const curr = document.documentElement.getAttribute('data-theme') || 'light';
            const next = curr === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('veyra_theme', next);
            const icon = document.getElementById('theme-toggle-icon-mng');
            if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        window.addEventListener('DOMContentLoaded', initMngTheme);
    </script>

</body>
</html>
