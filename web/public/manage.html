<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEYRA - Manage Discord Servers</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="js/tilt-engine.js"></script>
</head>
<body class="theme-slate">
    <canvas id="smokey-fluid-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100000; mix-blend-mode: screen;"></canvas>
    <canvas id="bg-violet-particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1;"></canvas>

    <div id="custom-cursor"></div>
    <div class="ambient-mesh"></div>
    <div class="grid-mask"></div>
    <div class="scanlines"></div>
    <div id="lightpillar-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; opacity: 0.55; mix-blend-mode: screen;"></div>

    <nav class="navbar" id="main-nav">
        <div class="nav-logo" onclick="window.location.href='/'" style="cursor: pointer;">
            <img src="assets/bypass_logs_avatar.webp" alt="VEYRA Logo" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,0.2); vertical-align: middle; margin-right: 6px; display: inline-block;">
            <span>VEYRA</span>
        </div>
        <ul class="nav-links" style="display: flex; gap: 24px; list-style: none; align-items: center;">
            <li class="nav-item" id="nav-home">
                <button class="gen-btn" onclick="window.location.href='/'">
                    <div class="gen-txt-wrapper">
                        <span class="gen-btn-letter">H</span>
                        <span class="gen-btn-letter">o</span>
                        <span class="gen-btn-letter">m</span>
                        <span class="gen-btn-letter">e</span>
                    </div>
                </button>
            </li>
            <li class="nav-item active" id="nav-manage-servers">
                <button class="gen-btn active" onclick="window.location.href='/manage'">
                    <div class="gen-txt-wrapper">
                        <span class="gen-btn-letter">M</span>
                        <span class="gen-btn-letter">a</span>
                        <span class="gen-btn-letter">n</span>
                        <span class="gen-btn-letter">a</span>
                        <span class="gen-btn-letter">g</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">&nbsp;</span>
                        <span class="gen-btn-letter">S</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">r</span>
                        <span class="gen-btn-letter">v</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">r</span>
                        <span class="gen-btn-letter">s</span>
                    </div>
                </button>
            </li>
            <li class="nav-item" id="nav-features">
                <button class="gen-btn" onclick="window.location.href='/#features'">
                    <div class="gen-txt-wrapper">
                        <span class="gen-btn-letter">F</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">a</span>
                        <span class="gen-btn-letter">t</span>
                        <span class="gen-btn-letter">u</span>
                        <span class="gen-btn-letter">r</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">s</span>
                    </div>
                </button>
            </li>
            <li class="nav-item" id="nav-tickets">
                <button class="gen-btn" onclick="window.location.href='/ticket'">
                    <div class="gen-txt-wrapper">
                        <span class="gen-btn-letter">T</span>
                        <span class="gen-btn-letter">i</span>
                        <span class="gen-btn-letter">c</span>
                        <span class="gen-btn-letter">k</span>
                        <span class="gen-btn-letter">e</span>
                        <span class="gen-btn-letter">t</span>
                        <span class="gen-btn-letter">s</span>
                    </div>
                </button>
            </li>
        </ul>
        <div class="nav-auth" style="display: flex; align-items: center; gap: 12px; position: relative;">
            <button onclick="openCommandPalette()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-family: var(--font-display); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <i class="fas fa-search" style="font-size: 0.75rem; color: #a855f7;"></i>
                <span>Search VEYRA...</span>
                <kbd style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 4px; font-size: 0.68rem; font-family: var(--font-mono); color: #a855f7;">Ctrl K</kbd>
            </button>
            <button class="liquid-metal-btn" onclick="simulateLogin()" id="login-btn">
                <div class="liquid-metal-btn-inner"><i class="fab fa-discord" style="color: #a855f7;"></i><span>Login with Discord</span></div>
            </button>
        </div>
    </nav>

    <div id="command-palette-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); z-index: 999999; align-items: flex-start; justify-content: center; padding-top: 100px;">
        <div style="background: #121216; border: 1px solid rgba(168,85,247,0.3); border-radius: 12px; width: 90%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; font-family: var(--font-display);">
            <div style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px;">
                <i class="fas fa-search" style="color: #a855f7;"></i>
                <input type="text" id="cmd-palette-input" placeholder="Type a command or search VEYRA modules..." style="background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; width: 100%; font-family: var(--font-display);" onkeyup="filterCommandPalette(this.value)">
                <kbd style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; color: #94a3b8; font-family: var(--font-mono);">ESC</kbd>
            </div>
            <div id="cmd-palette-results" style="max-height: 350px; overflow-y: auto; padding: 8px;">
                <div onclick="navigatePalette('/manage')" class="cmd-item" style="padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff;">
                    <div style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-shield-halved" style="color: #a855f7;"></i><span>Security Center</span></div>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">Anti-Nuke, Anti-Raid & Lockdown</span>
                </div>
                <div onclick="navigatePalette('/manage')" class="cmd-item" style="padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff;">
                    <div style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-gavel" style="color: #f59e0b;"></i><span>Moderation Cases</span></div>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">View & Edit Cases</span>
                </div>
                <div onclick="navigatePalette('/ticket')" class="cmd-item" style="padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff;">
                    <div style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-ticket-alt" style="color: #10b981;"></i><span>Tickets Inbox</span></div>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">Open Support Panels</span>
                </div>
            </div>
        </div>
    </div>

    <div style="padding-top: 120px; min-height: 70vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;">
        <section id="screen-servers" class="content-area" style="display:block; max-width:550px; margin: 0 auto 60px auto; padding: 20px; width: 100%;">
            <div style="padding: 40px; text-align: center; color: var(--text-secondary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #a855f7; margin-bottom: 12px;"></i>
                <p>Loading servers directory...</p>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/smokey-fluid-cursor.js"></script>
    <script src="js/dashboard.js?v=2"></script>
    <script>
        function openCommandPalette() {
            const modal = document.getElementById('command-palette-modal');
            if (modal) { modal.style.display = 'flex'; document.getElementById('cmd-palette-input')?.focus(); }
        }
        function closeCommandPalette() {
            const modal = document.getElementById('command-palette-modal');
            if (modal) modal.style.display = 'none';
        }
        function navigatePalette(url) { closeCommandPalette(); window.location.href = url; }
        function filterCommandPalette(q) {
            const items = document.querySelectorAll('#cmd-palette-results .cmd-item');
            items.forEach(it => { it.style.display = it.textContent.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none'; });
        }
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCommandPalette(); }
            if (e.key === 'Escape') closeCommandPalette();
        });
    </script>
</body>
</html>
